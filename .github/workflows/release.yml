name: Release

# Builds APIKit for every platform and attaches the installers to a published
# GitHub release. Runs when a version tag is pushed (`git tag v0.1.0 &&
# git push --tags`) or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Created once, up front, as a prerelease. Three constraints have to hold at
  # the same time: the build jobs must not race to create it (that scattered
  # assets across several releases), it must be reachable by tag so they can
  # upload to it (a draft is not — it has no tag until published), and it must
  # stay out of `releases/latest` until it actually has assets, or the
  # updater's latest.json 404s for the length of the build. A prerelease is
  # the one state that satisfies all three.
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # Manual run: derive the tag from the app version.
            version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title "APIKit $tag" \
              --notes "Downloads for Windows, macOS (Intel and Apple Silicon) and Linux are attached below."

  build:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (M1 and later)
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel, cross-compiled from the ARM runner
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04 # .deb, .rpm and AppImage
            args: ""
          - platform: windows-latest # .msi and .exe (NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both mac targets are installed so the Intel build can cross-compile.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # The two mac jobs share a runner OS but build different targets;
          # keying the cache on args keeps them from evicting each other.
          key: ${{ matrix.args }}

      - name: Install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update packages so the app only installs authentic updates.
          # This is the free minisign key, not OS code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ needs.release.outputs.tag }}
          args: ${{ matrix.args }}

  # Only now does the release become visible to `releases/latest` — and so to
  # the updater. A failed platform build leaves it a draft rather than shipping
  # a release the updater cannot serve.
  publish:
    # `release` too, not just `build`: its tag output is read below.
    needs: [release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release.outputs.tag }}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
